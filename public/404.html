<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurul Islam</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #00ff00;
      font-family: "Google Sans Code", "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      color: #00aa00;
    }

    .prompt {
      color: #00ff00;
    }
  </style>
</head>

<body>
  <div class="terminal">
    <div class="prompt">&gt; user@nurul:~$ loading...</div>
    <div> &gt; Restoring requested route...</div>
  </div>

  <script>
    const redirect =
      window.location.pathname +
      window.location.search +
      window.location.hash;

    sessionStorage.setItem("redirect", redirect);
    window.location.replace("/");
  </script>
</body>
</html>
